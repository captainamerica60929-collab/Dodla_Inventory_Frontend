  +[['Fetch GRN from SAP','doc','linear-gradient(135deg,#2E6BA6,#4f8fd6)',"page='grn';fetchSAP()"],['Map stock to location','inw','linear-gradient(135deg,#2F6F4E,#2bb38a)',"page='in';render();openM('in')"],['Give out stock','out','linear-gradient(135deg,#E8A33D,#d9622b)',"page='out';render();openM('out')"],['Change location','swap','linear-gradient(135deg,#6B4FA3,#b05fc4)',"page='tr';render();openM('tr')"]].map(([t,i,g,f])=>`<button style="--g:${g}" onclick="${f}">${ic(i)}${t}</button>`).join('')+`</div></div>`;
 return hero
 +`<div class="sg">${stat('Stickers in stock',q.length,'In '+new Set(q.map(x=>x.loc)).size+' bins','#2E6BA6','','box')+stat('Qty on hand',qty,tot.length+' materials','#2F6F4E','','dash')+stat('Awaiting inward',pc(),'Printed, not fully mapped','#C67F1F','','inw')+stat('Given out',outs.reduce((a,x)=>a+x.qty,0),outs.length+' FIFO issues','#6B4FA3','','out')}</div>`
 +`<div class="flow">${pipe.map(([l,v,c],i)=>`${i?'<span class="fa">›</span>':''}<div class="fs ${v?'live':''}" style="--c:${c}"><b class="cu" data-v="${v}">${v}</b><span>${l}</span></div>`).join('')}</div>`
 +`<div class="g2">${panel('Stock by material','Share of quantity on hand',`<div class="dn"><svg viewBox="0 0 140 140"><circle class="tk" cx="70" cy="70" r="54"/>${seg}<text x="70" y="68" text-anchor="middle" font-size="22">${qty}</text><text class="t2" x="70" y="84" text-anchor="middle">units in stock</text></svg><div class="lg" style="flex:1;min-width:150px">${tot.map(x=>`<div style="--c:${x.c}"><i></i>${x.m.name}<b>${x.v}</b></div>`).join('')}</div></div>`)}
 ${panel('Bin heat map','Fill level of every location',`<div class="bins">${locs.map(l=>{const u=used(l.code),pc_=Math.min(100,u/l.cap*100),c=pc_>=90?'#C1443D':pc_>=60?'#E8A33D':'#2F6F4E';return `<div class="bin" style="--c:${c}"><b class="mono">${l.code}</b><span>${u} of ${l.cap} · ${Math.round(pc_)}%</span><div class="bar"><i style="width:${pc_}%"></i></div></div>`}).join('')}</div>`)}</div>`
 +`<div class="g2">${panel('Live activity','Latest stock movements',`<div class="tl">${act.map(l=>`<div style="--c:${tc[l.type]||'#8A97A6'}"><i></i><span><b>${l.type}</b> ${l.qty} × ${l.mat} <span class="mono">${l.loc}</span></span><small>${fmt(l.t)}</small></div>`).join('')}</div>`)}
 ${panel('Next FIFO picks','Oldest sticker per material',T(['Item','Sticker','Bin','Qty','Age'],mats.map(m=>fifo(m.code)[0]).filter(Boolean).map(x=>[`${x.mat} ${mn(x.mat)}`,`<span class="mono">${x.stk}</span>`,x.loc,x.qty,pill(days(x.inAt)>30?'pr':days(x.inAt)>14?'pa':'pg',days(x.inAt)+' days')])))}</div>`},
mat(){return panel('Material master','Each material has a putaway zone used by inward',`<div class="fm"><input id="mc" placeholder="Code" size="7"><input id="mnm" placeholder="Name"><input id="mu" placeholder="UoM" size="5">${zsel('mz')}<button class="btn a" onclick="addMat()">Add material</button></div>`+T(['Code','Name','UoM','Putaway zone'],mats.map(m=>[`<span class="mono">${m.code}</span>`,m.name,m.uom,pill('pp','Zone '+m.zone)])))},
loc(){return panel('Location master','Capacity is the quantity a bin can hold',`<div class="fm"><input id="lc" placeholder="e.g. A-03-01" size="11">${zsel('lz')}<input id="lcap" type="number" min="1" value="500" style="width:80px"><button class="btn a" onclick="addLoc()">Add location</button></div>`+T(['Location','Zone','Capacity','Used','Free','Fill'],locs.map(l=>{const p=used(l.code)/l.cap*100;return [`<span class="mono">${l.code}</span>`,pill('pp','Zone '+l.zone),l.cap,used(l.code),l.cap-used(l.code),`<div class="bar" style="--c:${p>=100?'var(--red)':'var(--green)'}"><i style="width:${p}%"></i></div>`]})))},
emp(){return panel('Employee master','Warehouse staff. Users are created from these records',`<div class="fm"><input id="en" placeholder="Employee name"><select id="ed">${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select><input id="eds" placeholder="Designation"><input id="eph" placeholder="Phone" size="12"><button class="btn a" onclick="addEmp()">Add employee</button></div>`+T(['ID','Name','Department','Designation','Phone','Status',''],emps.map(e=>[`<span class="mono">${e.id}</span>`,e.name,e.dept,e.des,e.ph,pill(e.on?'pg':'pr',e.on?'Active':'Inactive'),`<button class="btn s" onclick="togEmp('${e.id}')">${e.on?'Deactivate':'Activate'}</button>`])))},
usr(){const act=emps.filter(e=>e.on);return panel('User master','Login and role for each employee. Deactivating an employee also locks their user',`<div class="fm"><input id="uu" placeholder="Username" size="14"><select id="ue"><option value="">Select employee</option>${act.map(e=>`<option value="${e.id}">${e.name} (${e.id})</option>`).join('')}</select><select id="ur">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select><button class="btn a" onclick="addUser()">Add user</button></div>`+T(['Username','Employee','Department','Role','Last login','Status',''],users.map(x=>[`<span class="mono">${x.u}</span>`,en(x.emp),(emps.find(e=>e.id===x.emp)||{}).dept,pill({Admin:'pp','Store Keeper':'pb2',Operator:'pa',Viewer:'pg'}[x.role],x.role),x.last?fmt(x.last):'Never',pill(x.on?'pg':'pr',x.on?'Active':'Locked'),`<button class="btn s" onclick="togUser('${x.u}')">${x.on?'Lock':'Unlock'}</button>`]))+`<div class="pb" style="border-top:1px solid var(--line)"><h3 style="font-size:13px;margin-bottom:8px">What each role can do</h3>${T(['Role','Master','GRN and sticker','Inward','Outward','Reports'],[['Admin','Edit','Yes','Yes','Yes','Yes'],['Store Keeper','View','Yes','Yes','Yes','Yes'],['Operator','No','No','Yes','Yes','No'],['Viewer','View','No','No','No','Yes']])}</div>`)},
grn(){return panel('GRN from SAP','Fetch receipts, then print a sticker per line to paste on the product',`<div class="fm"><button class="btn p" onclick="fetchSAP()">${ic('doc')} Fetch GRN from SAP</button><span class="api mono">GET /sap/opu/odata/sap/API_MATERIAL_DOCUMENT_SRV/A_MaterialDocumentItem</span></div>`+T(['GRN','PO','Vendor','Date','Material','Qty','Batch','Sticker','Status',''],grn.map(g=>[g.id,g.po,g.vendor,g.date,`${g.mat} ${mn(g.mat)}`,g.qty,g.batch,`<span class="mono">${g.stk}</span>`,sp(g.status),`<button class="btn s" onclick="printSticker('${g.id}')">${ic('doc')} ${g.status==='Open'?'Print sticker':'Reprint'}</button>`]),'No GRN loaded. Select Fetch GRN from SAP.'))},
in(){const p=grn.filter(g=>g.status!=='Open'&&pend(g)>0),rec=log.filter(l=>l.type==='IN'&&!l.void&&l.note!=='Opening stock').slice(-8).reverse();
 return panel('Map stock to location','Scan the sticker, check the item, choose a bin and confirm the quantity',`<div class="fm"><button class="btn a" onclick="openM('in')">${ic('inw')} Map stock to location</button><span class="api">Part of a GRN line can go to one bin and the rest to another.</span></div>`+T(['Sticker','Item','Batch','GRN qty','Mapped','Pending','Suggested bin','Status',''],p.map(g=>{const l=suggest(g.mat);return [`<span class="mono">${g.stk}</span>`,`${g.mat} ${mn(g.mat)}`,g.batch,g.qty,g.mapped||0,pend(g),l?pill('pg',l.code):pill('pr','No free bin'),sp(g.status),`<button class="btn s" onclick="openM('in','${g.stk}')">Map</button>`]}),'Nothing pending. Fetch GRN and print stickers on the GRN page.'))
 +panel('Recent inward','Saved mappings',T(['Time','Sticker','Item','Qty','Location','Note',''],rec.map(l=>[fmt(l.t),`<span class="mono">${l.stk}</span>`,`${l.mat} ${mn(l.mat)}`,l.qty,l.loc,l.note,`<button class="btn s" onclick="askVoid('in',${l.id})">Delete</button>`]),'No inward entries yet.'))},
out(){const q=mats.flatMap(m=>fifo(m.code).map((r,i)=>({r,i}))),rec=log.filter(l=>l.type==='OUT'&&!l.void).slice(-8).reverse();
 return panel('Give out stock','FIFO. The oldest stock of each item goes first',`<div class="fm"><button class="btn a" onclick="openM('out')">${ic('out')} Give out stock</button></div>`+T(['Pick order','Sticker','Item','Batch','Qty','Location','Age',''],q.map(({r,i})=>({nx:!i,c:[i?i+1:pill('pa','Next'),`<span class="mono">${r.stk}</span>`,`${r.mat} ${mn(r.mat)}`,r.batch,r.qty,r.loc,days(r.inAt)+' d',`<button class="btn s" onclick="openM('out','${r.stk}','${r.loc}')">Give out</button>`]})),'No stock in the warehouse.'))
 +panel('Recent give outs','',T(['Time','Sticker','Item','Qty','From location',''],rec.map(l=>[fmt(l.t),`<span class="mono">${l.stk}</span>`,`${l.mat} ${mn(l.mat)}`,l.qty,l.loc,`<button class="btn s" onclick="askVoid('out',${l.id})">Undo</button>`]),'Nothing given out yet.'))},
tr(){const q=[...inStock()].sort((a,b)=>a.mat.localeCompare(b.mat)||byAge(a,b)),rec=log.filter(l=>l.type==='MOVE'&&!l.void&&l.note.startsWith('Transferred')).slice(-8).reverse();
 return panel('Change location','Move stock, or part of it, from one bin to another. The FIFO date stays the same',`<div class="fm"><button class="btn a" onclick="openM('tr')">${ic('out')} Change location</button></div>`+T(['Sticker','Item','Batch','Qty','Location','Age',''],q.map(r=>[`<span class="mono">${r.stk}</span>`,`${r.mat} ${mn(r.mat)}`,r.batch,r.qty,pill('pb2',r.loc),days(r.inAt)+' d',`<button class="btn s" onclick="openM('tr','${r.stk}','${r.loc}')">Change</button>`]),'No stock.'))
 +panel('Recent transfers','',T(['Time','Sticker','Item','Qty','Now at','Details'],rec.map(l=>[fmt(l.t),`<span class="mono">${l.stk}</span>`,`${l.mat} ${mn(l.mat)}`,l.qty,l.loc,l.note]),'No transfers yet.'))},
rep(){let b='';
 if(rep==='stock')b=T(['Material','Name','Stickers','Qty','Locations'],mats.map(m=>{const q=fifo(m.code);return [m.code,m.name,q.length,q.reduce((a,s)=>a+s.qty,0),[...new Set(q.map(s=>s.loc))].join(', ')||'-']}));
 if(rep==='fifo')b=T(['Material','Sticker','Batch','Qty','Location','Inward','Age','Pick order'],mats.flatMap(m=>fifo(m.code).map((s,i)=>[m.code,`<span class="mono">${s.stk}</span>`,s.batch,s.qty,s.loc,fmt(s.inAt),pill(days(s.inAt)>30?'pr':days(s.inAt)>14?'pa':'pg',days(s.inAt)+' d'),i+1])));
 if(rep==='loc')b=T(['Location','Zone','Capacity','Used','Stickers held'],locs.map(l=>[`<span class="mono">${l.code}</span>`,l.zone,l.cap,used(l.code),inStock().filter(s=>s.loc===l.code).map(s=>s.stk).join(', ')||'Empty']));
 if(rep==='mv')b=T(['Time','Type','Sticker','Material','Qty','Location','Note'],[...log].reverse().map(l=>[fmt(l.t),pill(l.type==='IN'?'pg':l.type==='MOVE'?'pb2':l.type==='OUT'?'pa':'pr',l.type),`<span class="mono">${l.stk}</span>`,l.mat,l.qty,l.loc,l.note+(l.void?' (deleted)':'')]));
 if(rep==='grn')b=T(['GRN','PO','Vendor','Material','Qty','Sticker','Status'],grn.map(g=>[g.id,g.po,g.vendor,g.mat,g.qty,`<span class="mono">${g.stk}</span>`,sp(g.status)]),'Fetch GRN data on the GRN page first.');
 return `<div class="tabs">${[['stock','Stock summary'],['fifo','FIFO ageing'],['loc','Location utilisation'],['mv','Movement log'],['grn','GRN status']].map(([k,l])=>`<button class="${rep===k?'on':''}" onclick="rep='${k}';render()">${l}</button>`).join('')}</div>`+panel(({stock:'Stock summary',fifo:'FIFO ageing',loc:'Location utilisation',mv:'Movement log',grn:'GRN status'})[rep],'',b)}};

function render(){
 $('#nv').innerHTML=NAV.map(([g,it])=>`<div class="gl">${g.toUpperCase()}</div>`+it.map(([id,l,i])=>`<button class="ni ${page===id?'on':''}" style="--ic:${PCOL[id]}" onclick="page='${id}';sb.classList.remove('open');render()">${ic(i)}${l}${id==='in'&&pc()?`<span class="bd">${pc()}</span>`:''}</button>`).join('')).join('');
 const cur=NAV.flatMap(g=>g[1]).find(x=>x[0]===page);$('#pt').textContent=cur[1];$('#pc').textContent=cur[3];
 const ch=page!==lastPage;lastPage=page;const app=$('#app');app.className='ct'+(ch?' enter':'');app.style.setProperty('--acc',PCOL[page]);app.innerHTML=msgHtml()+V[page]();if(ch)countUp()}
render();
</script>
</body>
</html>
